<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="قیمت قطعات">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>قیمت زنده قطعات کامپیوتر</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--card:#fff;--tx:#14201c;--mu:#62706a;--ac:#0f766e;--ac2:#ccfbf1;--bd:#dbe2df;--er:#fee2e2;--ert:#7f1d1d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1513;--card:#16201d;--tx:#e8f0ed;--mu:#93a39d;--ac:#2dd4bf;--ac2:#134e4a;--bd:#263430;--er:#3b1111;--ert:#fecaca}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:1.5rem;font-weight:800;margin:8px 0 2px}
.sub{color:var(--mu);margin:0 0 14px;font-size:.9rem}
form{display:flex;gap:8px}
input[type=search]{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
button{font:inherit;cursor:pointer}
.go{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:0 18px;font-weight:600}
@media (prefers-color-scheme:dark){.go{color:#06231f}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 14px;border-radius:99px;font-size:.85rem}
.tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.85rem;color:var(--mu)}
select{font:inherit;padding:4px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.row{display:grid;grid-template-columns:auto 64px 1fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.row.on{border-color:var(--ac);background:var(--ac2)}
.row img{width:64px;height:64px;object-fit:contain;border-radius:8px;background:#fff}
.row input{width:20px;height:20px;accent-color:var(--ac)}
.t{font-size:.88rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p{font-weight:800;color:var(--ac)}
.old{color:var(--mu);font-size:.78rem;text-decoration:line-through;margin-inline-start:8px}
a{color:var(--mu);font-size:.78rem}
.msg{text-align:center;color:var(--mu);padding:28px 8px}
.msg.err{background:var(--er);color:var(--ert);border-radius:10px}
.bar{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--bd);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar b{font-size:1.1rem;color:var(--ac)}
.bar button{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:8px;padding:6px 12px}
</style>
</head>
<body>
<main>
<h1>قیمت زنده قطعات کامپیوتر</h1>
<p class="sub">نام قطعه را جستجو کنید؛ قیمت‌ها همان لحظه از دیجی‌کالا می‌آیند.</p>
<form id="f"><input type="search" id="q" placeholder="مثلاً RTX 4060 یا رم DDR5" aria-label="جستجو"><button class="go">جستجو</button></form>
<div class="chips" id="chips"></div>
<div class="tools" id="tools" hidden><span id="cnt"></span><select id="sort" aria-label="مرتب‌سازی"><option value="rel">مرتبط‌ترین</option><option value="asc">ارزان‌ترین</option><option value="desc">گران‌ترین</option></select></div>
<div id="list"><div class="msg">یک قطعه را جستجو کنید یا یکی از دسته‌ها را بزنید.</div></div>
</main>
<div class="bar"><div><span>جمع انتخاب‌شده: <b id="sum">۰</b> تومان</span><button id="clr">پاک کردن</button></div></div>
<script>
var PRESETS=["پردازنده","مادربرد","رم DDR5","رم DDR4","کارت گرافیک RTX 4060","SSD NVMe 1TB","هارد اینترنال","پاور 650","کیس گیمینگ","خنک‌کننده پردازنده","فن کیس","مانیتور گیمینگ","کیبورد","ماوس"];
var $=function(i){return document.getElementById(i)},cur=[],basket={};
try{basket=JSON.parse(localStorage.getItem("basket")||"{}")}catch(e){}
function fa(n){return Number(n).toLocaleString("fa-IR")}
function saveB(){try{localStorage.setItem("basket",JSON.stringify(basket))}catch(e){}}
function sum(){var t=0;for(var k in basket)t+=basket[k].price;$("sum").textContent=fa(t)}
function msg(t,err){$("list").innerHTML="";var d=document.createElement("div");d.className="msg"+(err?" err":"");d.textContent=t;$("list").appendChild(d)}
function draw(){
 var a=cur.slice(),s=$("sort").value;
 if(s==="asc")a.sort(function(x,y){return x.price-y.price});
 if(s==="desc")a.sort(function(x,y){return y.price-x.price});
 $("tools").hidden=!a.length;$("cnt").textContent=fa(a.length)+" نتیجه";
 var L=$("list");L.innerHTML="";
 a.forEach(function(p){
  var r=document.createElement("div");r.className="row"+(basket[p.id]?" on":"");
  var c=document.createElement("input");c.type="checkbox";c.checked=!!basket[p.id];c.setAttribute("aria-label","انتخاب");
  c.onchange=function(){if(c.checked)basket[p.id]={price:p.price};else delete basket[p.id];saveB();r.className="row"+(c.checked?" on":"");sum()};
  var im=document.createElement("img");im.alt="";im.loading="lazy";im.src=p.image;
  var b=document.createElement("div"),t=document.createElement("div");t.className="t";t.textContent=p.title;
  var pr=document.createElement("div"),pp=document.createElement("span");pp.className="p";pp.textContent=fa(p.price)+" تومان";pr.appendChild(pp);
  if(p.oldPrice){var o=document.createElement("span");o.className="old";o.textContent=fa(p.oldPrice);pr.appendChild(o)}
  var l=document.createElement("a");l.href=p.url;l.target="_blank";l.rel="noopener";l.textContent="مشاهده در دیجی‌کالا";
  b.appendChild(t);b.appendChild(pr);b.appendChild(l);r.appendChild(c);r.appendChild(im);r.appendChild(b);L.appendChild(r)});
 sum()}
function search(q){
 q=q.trim();if(!q)return;$("q").value=q;msg("در حال دریافت قیمت‌ها…");
 fetch("/.netlify/functions/search?q="+encodeURIComponent(q)).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})}).then(function(x){
  if(!x.ok){msg(x.j.error==="digikala_unreachable"?"دیجی‌کالا پاسخ نداد. چند دقیقه بعد دوباره امتحان کنید.":"خطایی رخ داد. دوباره تلاش کنید.",true);return}
  cur=x.j.products;if(!cur.length){msg("نتیجه‌ای پیدا نشد. عبارت دیگری امتحان کنید.");$("tools").hidden=true;return}
  draw()}).catch(function(){msg("اتصال برقرار نشد. اینترنت و میزبانی تابع را بررسی کنید.",true)})}
PRESETS.forEach(function(t){var b=document.createElement("button");b.className="chip";b.type="button";b.textContent=t;b.onclick=function(){search(t)};$("chips").appendChild(b)});
$("f").onsubmit=function(e){e.preventDefault();search($("q").value)};
$("sort").onchange=draw;
$("clr").onclick=function(){basket={};saveB();draw();sum()};
sum();
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script>
</body>
</html>
